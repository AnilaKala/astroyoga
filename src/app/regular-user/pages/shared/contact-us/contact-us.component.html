<div class="contact-section py-5">
    <div class="container text-center">
        <div class="card  mb-4 p-3">
      <h6 class="text-primary fw-bold">CONTACT US</h6>
      <h2 class="fw-bold mb-4">
        If You Have Any Query, Feel<br />
        Free To Contact Us
      </h2>
  
      <div class="row mb-5">
        <div class="col-md-4" *ngFor="let info of contactInfo">
          <div class="d-flex flex-column align-items-center mb-4">
            <div class="icon-box bg-primary text-white mb-3 d-flex align-items-center justify-content-center">
              <i class="bi fs-3" [ngClass]="info.icon"></i>
            </div>
            <h6 class="fw-semibold">{{ info.title }}</h6>
            <p class="text-primary fw-bold fs-5 m-0">{{ info.content }}</p>
          </div>
        </div>
      </div>
  
      <div class="row g-4">
        <!-- Contact Form -->
        <div class="col-md-6">
          <form>
            <div class="row g-3">
              <div class="col-md-6">
                <input type="text" class="form-control bg-light border-0" placeholder="Your Name" />
              </div>
              <div class="col-md-6">
                <input type="email" class="form-control bg-light border-0" placeholder="Your Email" />
              </div>
              <div class="col-12">
                <input type="text" class="form-control bg-light border-0" placeholder="Subject" />
              </div>
              <div class="col-12">
                <textarea rows="5" class="form-control bg-light border-0" placeholder="Message"></textarea>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-primary w-100">Send Message</button>
              </div>
            </div>
          </form>
        </div>
  
        <!-- Map -->
        <div class="col-md-6">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3021.8207293847134!2d-73.98924398459384!3d40.74881737932733!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x4d5282ff29b0ce28!2sNew%20York%2C%20NY!5e0!3m2!1sen!2sus!4v1611749471563!5m2!1sen!2sus"
            width="100%"
            height="350"
            style="border:0;"
            allowfullscreen=""
            loading="lazy"
          ></iframe>
        </div>
      </div>
    </div>
    </div>
  </div>
