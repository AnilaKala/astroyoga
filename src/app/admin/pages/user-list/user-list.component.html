<div class="container">
    <h3>User List</h3>
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td><a (click)="goToDetail(user.id)">{{ user.name }}</a></td>
          <td>{{ user.email }}</td>
          <td>{{ user.role }}</td>
          <td>
            <button class="btn btn-primary btn-sm" (click)="goToEdit(user.id)">Edit</button>
            <button class="btn btn-danger btn-sm ms-2" (click)="deleteUser(user.id)">Delete</button>
            <button class="btn btn-warning btn-sm ms-2" (click)="markFavourite(user.id)">Favourite</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
