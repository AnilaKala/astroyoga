<div class="container">
    <h3>User Detail</h3>
    <div *ngIf="!isEdit" class="row">
      <div class="col-md-6">
        <p><strong>Name:</strong> {{ user.name }}</p>
        <p><strong>Email:</strong> {{ user.email }}</p>
      </div>
      <div class="col-md-6">
        <p><strong>Role:</strong> {{ user.role }}</p>
        <p><strong>Status:</strong> {{ user.status }}</p>
      </div>
      <div class="mt-3">
        <button class="btn btn-primary" (click)="toggleEdit()">Edit</button>
        <button class="btn btn-danger ms-2" (click)="deleteUser()">Delete</button>
        <button class="btn btn-warning ms-2" (click)="markFavourite()">Favourite</button>
      </div>
    </div>
  
    <div *ngIf="isEdit" class="row">
      <div class="col-md-6">
        <div class="mb-3">
          <label>Name</label>
          <input class="form-control" [(ngModel)]="user.name" />
        </div>
        <div class="mb-3">
          <label>Email</label>
          <input class="form-control" [(ngModel)]="user.email" />
        </div>
      </div>
      <div class="col-md-6">
        <div class="mb-3">
          <label>Role</label>
          <input class="form-control" [(ngModel)]="user.role" />
        </div>
        <div class="mb-3">
          <label>Status</label>
          <input class="form-control" [(ngModel)]="user.status" />
        </div>
      </div>
      <div class="mt-3">
        <button class="btn btn-success" (click)="updateUser()">Save</button>
        <button class="btn btn-secondary ms-2" (click)="toggleEdit()">Cancel</button>
      </div>
    </div>
  </div>
