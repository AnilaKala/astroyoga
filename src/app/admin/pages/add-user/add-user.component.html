<form [formGroup]="userForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label>Name</label>
      <input class="form-control" formControlName="name" />
    </div>
    <div class="mb-3">
      <label>Email</label>
      <input class="form-control" formControlName="email" />
    </div>
    <button class="btn btn-success" type="submit">Add User</button>
  </form>
